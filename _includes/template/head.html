<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="keywords" content="{{ site.keywords }}">
<meta name="author" content="{{ site.author }}">
<!-- Open Graph -->
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
{% if site.featured-image %}<meta property="og:image" content="{{ site.featured-image | absolute_url }}">{% endif %}
<!-- Twitter / X Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
{% if site.featured-image %}<meta name="twitter:image" content="{{ site.featured-image | absolute_url }}">{% endif %}
<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<!-- Google Fonts: Inter (UI) + Crimson Pro (headings) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Crimson+Pro:wght@400;600;700&display=swap">

{% if jekyll.environment == "production" %}
{% include template/analytics.html %}
{%- endif -%}
{% if layout.gallery == true or page.gallery == true %}
<link rel="stylesheet" href="{{ '/assets/lib/spotlight.min.css' | relative_url }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/lib/bootstrap.min.css' | relative_url }}" type="text/css">
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
<!-- Last build date: {{ site.time | date: "%Y-%m-%d" }} -->
